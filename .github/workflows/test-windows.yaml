name: Test windows workflow

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * 5

jobs:
  plugin-test-windows:
    strategy:
      matrix:
        # ref: https://github.com/actions/runner-images
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install vfox and test (Windows)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          scoop install vfox
          Compress-Archive -Path .\* -DestinationPath .\php.zip
          vfox -v
          vfox add -s php.zip
          vfox install php@latest
          vfox use -p php@latest
          Invoke-Expression "$(vfox activate pwsh)"
          php -v
          php -m
          if (-not ((php -m) -contains "openssl")) { throw "OpenSSL extension was not loaded" }
          composer -V
