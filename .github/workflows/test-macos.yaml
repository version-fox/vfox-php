name: Test macos workflow

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * 5

jobs:
  plugin-test-macos:
    strategy:
      matrix:
        # ref: https://github.com/actions/runner-images
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install vfox (MacOS)
        run: |
          brew tap version-fox/tap
          brew install vfox

      - name: Generate PHP plugin
        run: |
          zip -r php.zip ./

      - name: Install packages
        run: brew install autoconf automake bison freetype gd gettext icu4c krb5 libedit libiconv libjpeg libpng libxml2 libxslt libzip openssl@3 pkg-config re2c zlib

      - name: Test
        shell: bash
        run: |
          vfox add -s php.zip
          vfox install php@latest
          eval "$(vfox activate bash)"
          vfox use -p php@latest
          eval "$(vfox env --shell bash)"
          php -v
          php -m
          composer -V
