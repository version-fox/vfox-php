name: Test Plugin

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: 0 0 * * 5

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'version-fox/vfox-php'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Run the unit tests
        run: go test -short -count=1 -v ./...
        working-directory: tests/e2e

  macos:
    if: github.repository == 'version-fox/vfox-php'
    name: macOS (php_build)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install the Homebrew formulae that the build looks for
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install gmp libsodium openssl@3
      - name: Run the unit tests, with the build options checked against this Mac's Homebrew
        run: go test -short -count=1 -v ./...
        working-directory: tests/e2e
