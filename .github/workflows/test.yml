name: Test Plugin

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'version-fox/vfox-php'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Test plugin hooks with vfox's Lua interpreter
        run: go run github.com/yuin/gopher-lua/cmd/glua@v1.1.1 tests/hooks_test.lua
      - name: Test the compile step with the install path quoted
        run: go run github.com/yuin/gopher-lua/cmd/glua@v1.1.1 tests/post_install_test.lua
      - name: Test the uninstall step that removes a PHP build
        run: go run github.com/yuin/gopher-lua/cmd/glua@v1.1.1 tests/pre_uninstall_test.lua
      - name: Test the detection of PHP installs already on the machine
        run: go run github.com/yuin/gopher-lua/cmd/glua@v1.1.1 tests/detect_test.lua
      - name: Test Windows configuration and composer verification
        run: go run github.com/yuin/gopher-lua/cmd/glua@v1.1.1 tests/windows_test.lua
      - name: Test bin/install with its commands faked
        run: go test -count=1 -v ./install/
        working-directory: tests/e2e
