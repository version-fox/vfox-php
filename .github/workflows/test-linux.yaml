name: Test linux workflow

on:
  pull_request:
  push:
  schedule:
    - cron: 0 0 * * 5

jobs:
  plugin-test-linux:
    strategy:
      matrix:
        # ref: https://github.com/actions/runner-images
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: install vfox (Linux)
        run: |
          echo "deb [trusted=yes] https://apt.fury.io/versionfox/ /" | sudo tee /etc/apt/sources.list.d/versionfox.list
          sudo apt-get update
          sudo apt-get install vfox

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y autoconf bison build-essential curl gettext git libgd-dev libcurl4-openssl-dev libedit-dev libicu-dev libjpeg-dev libmysqlclient-dev libonig-dev libpng-dev libpq-dev libreadline-dev libsqlite3-dev libssl-dev libxml2-dev libxslt-dev libzip-dev openssl pkg-config re2c zlib1g-dev

      - name: Pre-generate manifest (for fallback when version-manifest release does not yet exist)
        run: python3 ./.github/update-manifest.py -o ./version-manifest.json

      - name: Generate PHP plugin
        run: |
          zip -r php.zip ./

      - name: Test
        run: |
          vfox add -s php.zip
          vfox install php@latest
          # `vfox list php` does not mark a version with `-> v` until something
          # has been activated, so the legacy `sed -n 's/-> v//p'` extraction
          # would return an empty string right after install. Match the bare
          # version string instead.
          INSTALLED=$(vfox list php | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-nts)?' | head -n 1)
          test -n "$INSTALLED"
          # vfox 1.0+ requires the shell hook for project / session scope and
          # only refreshes $PATH on the *next* activate after a `use`. Mirror
          # the double-activate pattern used by vfox-erlang's E2E tests:
          # first call sets up the hook, `use -g` writes the global pin, and
          # the second call picks up the just-installed PHP for $PATH.
          eval "$(vfox activate bash)"
          vfox use -g "php@$INSTALLED"
          eval "$(vfox activate bash)"
          php -v
          php -m
          composer -V
